[package]
name = "sizelint"
version = "0.1.6"
edition = "2024"
description = "Lint your working tree based on file size"
license = "MIT"
authors = ["Alexander Kenji Berthold"]
documentation = "https://github.com/a-kenji/sizelint"
homepage = "https://github.com/a-kenji/sizelint"
repository = "https://github.com/a-kenji/sizelint"
keywords = ["git", "linter", "formatter", "file-size", "ci-cd"]
categories = [
  "command-line-utilities",
  "development-tools",
  "development-tools::testing",
]
include = ["src/**/*", "LICENSE", "README.md", "tests/**/*"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "suggestions", "wrap_help"] }
clap_complete = "4.6.11"
colored = "3.1.1"
globset = "0.4.20"
ignore = "0.4.33"
miette = { version = "7.6.0", features = ["fancy"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
